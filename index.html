    <!-- Мгновенное применение фирменного цвета из кэша — до первого рендера (нет мигания) -->
    <script>
      (function () {
        try {
          var hex = localStorage.getItem('brand_color')
          if (!hex || !/^#[0-9a-f]{6}$/i.test(hex)) return
          var r = parseInt(hex.slice(1, 3), 16)
          var g = parseInt(hex.slice(3, 5), 16)
          var b = parseInt(hex.slice(5, 7), 16)
          var mix = function (base, target, ratio) {
            return {
              r: Math.round(base.r + (target.r - base.r) * ratio),
              g: Math.round(base.g + (target.g - base.g) * ratio),
              b: Math.round(base.b + (target.b - base.b) * ratio)
            }
          }
          var c = { r: r, g: g, b: b }
          var w = { r: 255, g: 255, b: 255 }
          var k = { r: 0,   g: 0,   b: 0   }
          var shades = {
            50:  mix(c, w, 0.95), 100: mix(c, w, 0.88), 200: mix(c, w, 0.75),
            300: mix(c, w, 0.58), 400: mix(c, w, 0.35), 500: mix(c, w, 0.15),
            600: mix(c, k, 0.08), 700: c,               800: mix(c, k, 0.20),
            900: mix(c, k, 0.35), 950: mix(c, k, 0.70)
          }
          var root = document.documentElement
          for (var shade in shades) {
            var s = shades[shade]
            root.style.setProperty('--brand-' + shade, s.r + ' ' + s.g + ' ' + s.b)
          }
        } catch (e) {}
        // Тёмные поверхности (подвал, плашки, секции) — тот же приём, что и
        // для brand: применяем закэшированный dark_color до первого рендера.
        try {
          var ink = localStorage.getItem('ink_color')
          if (!ink || !/^#[0-9a-f]{6}$/i.test(ink)) return
          var ir = parseInt(ink.slice(1, 3), 16)
          var ig = parseInt(ink.slice(3, 5), 16)
          var ib = parseInt(ink.slice(5, 7), 16)
          var l = function (v, t, k) { return Math.round(v + (t - v) * k) }
          var root2 = document.documentElement
          root2.style.setProperty('--ink-800', l(ir,255,0.10) + ' ' + l(ig,255,0.10) + ' ' + l(ib,255,0.10))
          root2.style.setProperty('--ink-900', ir + ' ' + ig + ' ' + ib)
          root2.style.setProperty('--ink-950', l(ir,0,0.60) + ' ' + l(ig,0,0.60) + ' ' + l(ib,0,0.60))
        } catch (e) {}
      })()
    </script>
